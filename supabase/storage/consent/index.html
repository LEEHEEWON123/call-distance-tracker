<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위치 공유 요청</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 700; color: #1c2333; margin-bottom: 8px; }
    p { color: #96a3b4; font-size: 14px; line-height: 1.65; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #f5a060, #e07830);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 18px rgba(224, 120, 48, 0.35);
    }
    button:disabled { background: #ddd; color: #aaa; box-shadow: none; cursor: default; }
    #status { margin-top: 14px; color: #96a3b4; font-size: 13px; min-height: 18px; }
    #done { display: none; font-size: 48px; margin-bottom: 12px; }
    #done-title { display: none; font-size: 18px; color: #1c2333; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-section">
      <div class="icon">📍</div>
      <h1>위치 공유 요청</h1>
      <p>상대방이 현재 위치 확인을 요청했습니다.<br>아래 버튼을 눌러 위치를 공유해 주세요.</p>
      <button type="button" id="btn">위치 공유 허용</button>
      <div id="status"></div>
    </div>
    <div id="done">✅</div>
    <h2 id="done-title">위치가 공유되었습니다!</h2>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      var status = document.getElementById('status');
      var btn = document.getElementById('btn');

      if (!token) {
        status.textContent = '잘못된 링크입니다.';
        btn.disabled = true;
        return;
      }

      var submitUrl = window.location.origin + '/functions/v1/submit-location/' + encodeURIComponent(token);

      btn.addEventListener('click', function () {
        btn.disabled = true;
        status.textContent = '위치를 가져오는 중...';

        if (!navigator.geolocation) {
          status.textContent = '이 브라우저는 위치 서비스를 지원하지 않습니다.';
          btn.disabled = false;
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            status.textContent = '위치를 전송하는 중...';
            fetch(submitUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              }),
            })
              .then(function (res) {
                if (!res.ok) throw new Error('submit failed');
                document.getElementById('form-section').style.display = 'none';
                document.getElementById('done').style.display = 'block';
                document.getElementById('done-title').style.display = 'block';
              })
              .catch(function () {
                status.textContent = '전송에 실패했습니다. 다시 시도해 주세요.';
                btn.disabled = false;
              });
          },
          function () {
            status.textContent = '위치 권한을 허용해 주세요.';
            btn.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      });
    })();
  </script>
</body>
</html>
