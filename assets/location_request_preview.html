<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위치 공유 요청</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e8ecf0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .screen {
      width: 390px;
      height: 844px;
      background: #f2f2f2;
      border-radius: 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 연락처 리스트 배경 */
    .contacts-bg {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 60px;
    }

    .contact-card {
      background: white;
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      opacity: 0.4;
    }
    .contact-card.active { opacity: 1; }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .contact-info { flex: 1; }
    .contact-name { font-size: 15px; font-weight: 600; color: #1c1c1e; }
    .contact-phone { font-size: 12px; color: #8e8e93; margin-top: 2px; }

    .loc-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5a060, #e07830);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(224,120,48,0.35);
    }

    /* 오버레이 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
      border-radius: 40px;
    }

    /* 바텀시트 */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 12px 24px 40px;
      animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* 핸들 */
    .handle {
      width: 36px; height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    /* 아바타 영역 */
    .sheet-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #93b5e1, #7098c8);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; color: white;
      margin: 0 auto 12px;
      box-shadow: 0 4px 16px rgba(112,152,200,0.35);
    }

    .sheet-name {
      font-size: 18px;
      font-weight: 800;
      color: #1c1c1e;
      text-align: center;
      margin-bottom: 6px;
    }

    .sheet-desc {
      font-family: 'Jua', sans-serif;
      font-size: 14px;
      color: #96a3b4;
      text-align: center;
      margin-bottom: 28px;
    }

    /* 버튼 영역 */
    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-cancel {
      flex: 1;
      padding: 15px;
      background: #f2f2f2;
      border: none;
      border-radius: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #96a3b4;
      cursor: pointer;
    }

    .btn-send {
      flex: 2;
      padding: 15px;
      background: linear-gradient(135deg, #f5a060, #e07830);
      border: none;
      border-radius: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(224,120,48,0.35);
    }

    .btn-send svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="screen">
    <!-- 연락처 배경 -->
    <div class="contacts-bg">
      <div class="contact-card">
        <div class="avatar" style="background: linear-gradient(135deg,#a8d8b9,#7bbf96)">김</div>
        <div class="contact-info">
          <div class="contact-name">김민준</div>
          <div class="contact-phone">010-1234-5678</div>
        </div>
        <div class="loc-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
      </div>
      <div class="contact-card active">
        <div class="avatar" style="background: linear-gradient(135deg,#93b5e1,#7098c8)">이</div>
        <div class="contact-info">
          <div class="contact-name">이지원</div>
          <div class="contact-phone">010-9876-5432</div>
        </div>
        <div class="loc-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
      </div>
      <div class="contact-card">
        <div class="avatar" style="background: linear-gradient(135deg,#f5c2c2,#e89090)">박</div>
        <div class="contact-info">
          <div class="contact-name">박서연</div>
          <div class="contact-phone">010-5555-1234</div>
        </div>
        <div class="loc-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
      </div>
    </div>

    <!-- 오버레이 -->
    <div class="overlay"></div>

    <!-- 바텀시트 -->
    <div class="bottom-sheet">
      <div class="handle"></div>

      <div class="sheet-avatar">이</div>

      <div class="sheet-name">이지원</div>
      <div class="sheet-desc">위치 공유 요청을 보낼까요?</div>

      <div class="btn-row">
        <button class="btn-cancel">취소</button>
        <button class="btn-send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          요청 보내기
        </button>
      </div>
    </div>
  </div>
</body>
</html>
