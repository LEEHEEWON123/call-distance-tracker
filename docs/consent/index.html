<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위치 공유 요청</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 20px; color: #1c2333; margin-bottom: 8px; }
    p { color: #96a3b4; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #f5a060, #e07830);
      color: #fff;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { background: #ddd; color: #aaa; }
    #status { margin-top: 14px; color: #96a3b4; font-size: 13px; min-height: 18px; }
    .emoji { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="panel">
      <div class="emoji" id="emoji">📍</div>
      <h1 id="title">위치 공유 요청</h1>
      <p id="message">상대방이 현재 위치 확인을 요청했습니다.<br>아래 버튼을 눌러 위치를 공유해 주세요.</p>
      <button type="button" id="btn" style="display:none">위치 공유 허용</button>
      <div id="status"></div>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var token = params.get('token');
      var error = params.get('error');
      var btn = document.getElementById('btn');
      var status = document.getElementById('status');
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var emoji = document.getElementById('emoji');

      var errors = {
        invalid: '잘못된 링크입니다.',
        not_found: '링크를 찾을 수 없습니다.',
        expired: '링크가 만료되었습니다.',
        completed: '위치가 이미 공유되었습니다.',
      };

      if (error) {
        emoji.textContent = error === 'completed' ? '✅' : '⚠️';
        title.textContent = error === 'completed' ? '완료' : '알림';
        message.textContent = errors[error] || '요청을 처리할 수 없습니다.';
        return;
      }

      if (!token) {
        emoji.textContent = '⚠️';
        title.textContent = '알림';
        message.textContent = errors.invalid;
        return;
      }

      btn.style.display = 'block';
      var submitUrl =
        'https://tcyfyxaccskgncexirxj.supabase.co/functions/v1/submit-location/' +
        encodeURIComponent(token);

      btn.addEventListener('click', function () {
        btn.disabled = true;
        status.textContent = '위치를 가져오는 중...';
        if (!navigator.geolocation) {
          status.textContent = '이 브라우저는 위치 서비스를 지원하지 않습니다.';
          btn.disabled = false;
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            status.textContent = '위치를 전송하는 중...';
            fetch(submitUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              }),
            })
              .then(function (res) {
                if (!res.ok) throw new Error('fail');
                emoji.textContent = '✅';
                title.textContent = '완료';
                message.textContent = '위치가 공유되었습니다!';
                btn.style.display = 'none';
                status.textContent = '';
              })
              .catch(function () {
                status.textContent = '전송에 실패했습니다. 다시 시도해 주세요.';
                btn.disabled = false;
              });
          },
          function () {
            status.textContent = '위치 권한을 허용해 주세요.';
            btn.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      });
    })();
  </script>
</body>
</html>
