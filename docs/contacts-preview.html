<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연락처 미리보기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #dde8f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .phone-frame {
    width: 390px;
    height: 844px;
    background: #ffffff;
    border-radius: 48px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.16), inset 0 0 0 1.5px rgba(255,255,255,0.7);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 검색바 */
  .search-wrap {
    background: white;
    padding: 36px 16px 14px;
  }
  .search-bar {
    display: flex;
    align-items: center;
    background: #f2f2f2;
    border: 1.5px solid #f2f2f2;
    border-radius: 14px;
    padding: 10px 16px;
    gap: 10px;
  }
  .search-bar svg { flex-shrink: 0; color: #aaa; }
  .search-bar input {
    border: none;
    background: none;
    outline: none;
    font-size: 14px;
    color: #333;
    width: 100%;
  }
  .search-bar input::placeholder { color: #aaaaaa; }

  /* 리스트 */
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 16px;
    background: #f2f2f2;
  }
  .list::-webkit-scrollbar { display: none; }

  /* 카드 */
  .card {
    background: white;
    border-radius: 20px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  /* 아바타 */
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  /* 이름/번호 */
  .info { flex: 1; }
  .name {
    font-size: 15px;
    font-weight: 600;
    color: #1c1c1e;
  }
  .phone {
    font-size: 12px;
    color: #8e8e93;
    margin-top: 3px;
  }

  /* 우측 버튼 */
  .pin-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f5a060, #e07830);
    box-shadow: 0 3px 10px rgba(224,120,48,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  /* 섹션 라벨 */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: #96a3b4;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 8px 4px 6px;
  }

  /* 요청 중 카드 */
  .card.requesting {
    border: 1.5px solid rgba(224,120,48,0.3);
    background: linear-gradient(135deg, #fffaf6, #fff8f3);
    position: relative;
    overflow: hidden;
  }
  .card.requesting::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #f5a060, #e07830);
    border-radius: 3px 0 0 3px;
  }

  /* 요청중 배지 */
  .req-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(224,120,48,0.1);
    color: #d07030;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 4px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .req-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #e07830;
    animation: blink 1.2s infinite;
  }

  /* 요청중일 때 우측 버튼 */
  .cancel-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  /* 다이얼로그 오버레이 */
  .dialog-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    border-radius: 48px;
  }
  .dialog-overlay.show {
    display: flex;
  }

  /* 바텀시트 스타일 다이얼로그 */
  .dialog-sheet {
    background: white;
    width: 100%;
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 36px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .dialog-overlay.show .dialog-sheet {
    transform: translateY(0);
  }

  /* 핸들 바 */
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: #e0e0e0;
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  /* 다이얼로그 아바타 */
  .dialog-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: white;
    margin: 0 auto 14px;
  }

  .dialog-name {
    font-size: 18px;
    font-weight: 700;
    color: #1c1c1e;
    text-align: center;
    margin-bottom: 6px;
  }
  .dialog-desc {
    font-size: 13px;
    color: #96a3b4;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  /* 버튼 행 */
  .dialog-btns {
    display: flex;
    gap: 10px;
  }
  .dialog-btn-cancel {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: #f2f2f2;
    color: #96a3b4;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .dialog-btn-confirm {
    flex: 1.6;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #f5a060, #e07830);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(224,120,48,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* 하단 탭 */
  .bottom-nav {
    background: white;
    border-top: 1px solid #edf0f4;
    display: flex;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 16px;
    gap: 4px;
  }
  .nav-label     { font-size: 11px; font-weight: 500; color: #5aaa85; }
  .nav-label.off { color: #b0bac8; }
</style>
</head>
<body>

<div class="phone-frame">

  <!-- 검색바 -->
  <div class="search-wrap">
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaaaaa" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
      <input type="text" placeholder="이름 또는 전화번호 검색" />
    </div>
  </div>

  <!-- 연락처 리스트 -->
  <div class="list">

    <!-- 요청 중 섹션 -->
    <div class="section-label">요청 중</div>
    <div class="card requesting">
      <div class="avatar" style="background: linear-gradient(135deg,#f5a878,#e88855)">이</div>
      <div class="info">
        <div class="name">이서연</div>
        <div class="req-badge">
          <div class="req-dot"></div>
          위치 요청 중
        </div>
      </div>
      <div class="cancel-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b0bac8" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </div>
    </div>

    <!-- 전체 연락처 섹션 -->
    <div class="section-label" style="margin-top:8px;">연락처</div>

    <div class="card">
      <div class="avatar" style="background: linear-gradient(135deg,#93b5e1,#7098c8)">김</div>
      <div class="info">
        <div class="name">김민준</div>
        <div class="phone">010-1234-5678</div>
      </div>
      <div class="pin-btn" onclick="openDialog('김민준','linear-gradient(135deg,#93b5e1,#7098c8)','김')">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="white"/>
          <circle cx="8" cy="8" r="3" fill="#e07830"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="avatar" style="background: linear-gradient(135deg,#a8d8b9,#7bbf96)">박</div>
      <div class="info">
        <div class="name">박지호</div>
        <div class="phone">010-3456-7890</div>
      </div>
      <div class="pin-btn" onclick="openDialog('박지호','linear-gradient(135deg,#a8d8b9,#7bbf96)','박')">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="white"/>
          <circle cx="8" cy="8" r="3" fill="#e07830"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="avatar" style="background: linear-gradient(135deg,#f5c2c2,#e89090)">최</div>
      <div class="info">
        <div class="name">최수아</div>
        <div class="phone">010-4567-8901</div>
      </div>
      <div class="pin-btn" onclick="openDialog('최수아','linear-gradient(135deg,#f5c2c2,#e89090)','최')">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="white"/>
          <circle cx="8" cy="8" r="3" fill="#e07830"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="avatar" style="background: linear-gradient(135deg,#c5b4e3,#a58cd4)">정</div>
      <div class="info">
        <div class="name">정하은</div>
        <div class="phone">010-5678-9012</div>
      </div>
      <div class="pin-btn" onclick="openDialog('정하은','linear-gradient(135deg,#c5b4e3,#a58cd4)','정')">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="white"/>
          <circle cx="8" cy="8" r="3" fill="#e07830"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="avatar" style="background: linear-gradient(135deg,#ffd97d,#f0be45)">강</div>
      <div class="info">
        <div class="name">강도윤</div>
        <div class="phone">010-6789-0123</div>
      </div>
      <div class="pin-btn" onclick="openDialog('강도윤','linear-gradient(135deg,#ffd97d,#f0be45)','강')">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="white"/>
          <circle cx="8" cy="8" r="3" fill="#e07830"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <div class="avatar" style="background: linear-gradient(135deg,#93b5e1,#7098c8)">윤</div>
      <div class="info">
        <div class="name">윤지우</div>
        <div class="phone">010-7890-1234</div>
      </div>
      <div class="pin-btn" onclick="openDialog('윤지우','linear-gradient(135deg,#93b5e1,#7098c8)','윤')">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="white"/>
          <circle cx="8" cy="8" r="3" fill="#e07830"/>
        </svg>
      </div>
    </div>

  </div>

  <!-- 하단 탭 -->
  <div class="bottom-nav">
    <div class="nav-item">
      <svg width="36" height="30" viewBox="0 0 38 32">
        <ellipse cx="14.4" cy="23" rx="10.5" ry="8.3" fill="#93b5e1"/>
        <circle cx="10.6" cy="20.8" r="2" fill="white"/>
        <circle cx="17.5" cy="20.8" r="2" fill="white"/>
        <circle cx="8.4" cy="23.4" r="1.4" fill="#f5a8b0"/>
        <circle cx="19.8" cy="23.4" r="1.4" fill="#f5a8b0"/>
        <path d="M10.6 25.6 Q14 27.8 17.5 25.6" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <g transform="translate(27.4,17.6) rotate(35)">
          <rect x="-6.1" y="-11.1" width="12.2" height="22.1" rx="4" fill="#e07830"/>
          <rect x="-3.8" y="-8.9" width="7.6" height="12.9" rx="2" fill="white" opacity="0.55"/>
        </g>
      </svg>
      <span class="nav-label off">통화 중</span>
    </div>
    <div class="nav-item">
      <svg width="36" height="30" viewBox="0 0 38 32">
        <ellipse cx="11.4" cy="22.4" rx="9" ry="8.5" fill="#93b5e1"/>
        <circle cx="8.1" cy="20.3" r="1.5" fill="white"/>
        <circle cx="13.9" cy="20.3" r="1.5" fill="white"/>
        <circle cx="6.4" cy="22.5" r="1.1" fill="#f5a8b0"/>
        <circle cx="15.2" cy="22.5" r="1.1" fill="#f5a8b0"/>
        <path d="M8.1 24.9 Q11.4 26.9 14.2 24.9" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
        <ellipse cx="26.6" cy="22.4" rx="9" ry="8.5" fill="#f5a878"/>
        <circle cx="23.3" cy="20.3" r="1.5" fill="white"/>
        <circle cx="29.1" cy="20.3" r="1.5" fill="white"/>
        <circle cx="21.6" cy="22.5" r="1.1" fill="#f5a8b0"/>
        <circle cx="30.4" cy="22.5" r="1.1" fill="#f5a8b0"/>
        <path d="M23.3 24.9 Q26.6 26.9 29.4 24.9" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">연락처</span>
    </div>
  </div>

  <!-- 확인 다이얼로그 (바텀시트) -->
  <div class="dialog-overlay" id="dialog" onclick="closeDialog(event)">
    <div class="dialog-sheet">
      <div class="sheet-handle"></div>
      <div class="dialog-avatar" id="dialog-avatar">김</div>
      <div class="dialog-name" id="dialog-name">김민준</div>
      <div class="dialog-desc">위치 공유 요청을<br>보낼까요?</div>
      <div class="dialog-btns">
        <button class="dialog-btn-cancel" onclick="closeDialog()">취소</button>
        <button class="dialog-btn-confirm" onclick="confirmRequest()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          요청 보내기
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  let pendingName = '';
  let pendingColor = '';
  let pendingInitial = '';

  function openDialog(name, color, initial) {
    pendingName = name;
    pendingColor = color;
    pendingInitial = initial;
    document.getElementById('dialog-name').textContent = name;
    document.getElementById('dialog-avatar').textContent = initial;
    document.getElementById('dialog-avatar').style.background = color;
    document.getElementById('dialog').classList.add('show');
  }

  function closeDialog(e) {
    if (e && e.target !== document.getElementById('dialog')) return;
    document.getElementById('dialog').classList.remove('show');
  }

  function confirmRequest() {
    document.getElementById('dialog').classList.remove('show');
    // 요청 중 섹션으로 이동 (실제 앱에서는 공유시트 뜸)
    alert(`${pendingName}에게 위치 요청을 보냈어요!`);
  }
</script>

</body>
</html>
