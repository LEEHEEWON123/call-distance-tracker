<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위치 확인</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f2f2f7;
      max-width: 390px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* 앱바 */
    #appbar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 0.5px solid rgba(0,0,0,0.12);
      z-index: 1000;
    }
    #appbar .back {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: #007AFF; font-size: 22px; cursor: pointer;
    }
    #appbar .title {
      flex: 1;
      font-size: 17px; font-weight: 600; color: #1c1c1e;
    }
    #appbar .badge {
      background: #34C759;
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
    }

    /* 지도 */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* 내 위치 중심 버튼 */
    #recenter {
      position: absolute;
      bottom: 230px;
      right: 16px;
      width: 44px; height: 44px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 999;
    }

    /* 하단 카드 */
    #panel {
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 16px 20px 32px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    #panel .handle {
      width: 36px; height: 4px;
      background: #d1d1d6;
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    /* 상대방 정보 */
    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 16px; font-weight: 700;
      flex-shrink: 0;
    }
    .contact-info .name {
      font-size: 15px; font-weight: 600; color: #1c1c1e;
    }
    .contact-info .time {
      font-size: 12px; color: #8e8e93; margin-top: 2px;
    }

    /* 거리 강조 */
    .distance-highlight {
      background: #f2f2f7;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .distance-highlight .big {
      font-size: 28px; font-weight: 700; color: #1c1c1e;
    }
    .distance-highlight .sub {
      font-size: 13px; color: #8e8e93; margin-top: 2px;
    }
    .distance-highlight .dist-icon {
      font-size: 28px; margin-left: auto;
    }

    /* 도보/차량 */
    .stats-row {
      display: flex;
      gap: 10px;
    }
    .stat-card {
      flex: 1;
      background: #f2f2f7;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stat-card .s-icon {
      font-size: 22px;
    }
    .stat-card .s-value {
      font-size: 16px; font-weight: 700; color: #1c1c1e;
    }
    .stat-card .s-label {
      font-size: 11px; color: #8e8e93; margin-top: 1px;
    }
  </style>
</head>
<body>

  <div id="appbar">
    <div class="back">‹</div>
    <div class="title">위치 확인</div>
    <div class="badge">통화 중</div>
  </div>

  <div id="map"></div>

  <div id="recenter">📍</div>

  <div id="panel">
    <div class="handle"></div>

    <div class="contact-row">
      <div class="avatar">상</div>
      <div class="contact-info">
        <div class="name">상대방</div>
        <div class="time">방금 위치 공유됨</div>
      </div>
    </div>

    <div class="distance-highlight">
      <div>
        <div class="big" id="dist">-</div>
        <div class="sub">직선 거리</div>
      </div>
      <div class="dist-icon">📏</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="s-icon">🚶</div>
        <div>
          <div class="s-value" id="walk">-</div>
          <div class="s-label">도보</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="s-icon">🚗</div>
        <div>
          <div class="s-value" id="drive">-</div>
          <div class="s-label">차량</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const myPos    = [37.4979, 127.0276];
    const theirPos = [37.5045, 127.0244];

    const map = L.map('map', { zoomControl: false }).setView([
      (myPos[0] + theirPos[0]) / 2,
      (myPos[1] + theirPos[1]) / 2
    ], 16);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    // 내 위치 (파란 원형 마커)
    const myIcon = L.divIcon({
      html: `<div style="
        width:20px;height:20px;
        background:#007AFF;
        border:3px solid white;
        border-radius:50%;
        box-shadow:0 2px 8px rgba(0,122,255,0.5);
      "></div>`,
      iconSize: [20, 20], iconAnchor: [10, 10], className: ''
    });

    // 내 위치 범위 원
    L.circle(myPos, { radius: 80, color: '#007AFF', fillColor: '#007AFF', fillOpacity: 0.08, weight: 1 }).addTo(map);
    L.marker(myPos, { icon: myIcon }).addTo(map).bindPopup('<b>나</b>');

    // 상대방 (빨간 핀)
    const theirIcon = L.divIcon({
      html: `<div style="position:relative;width:36px;height:44px;">
        <div style="
          width:36px;height:36px;
          background:linear-gradient(135deg,#FF3B30,#FF6B6B);
          border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);
          box-shadow:0 4px 12px rgba(255,59,48,0.4);
        "></div>
        <div style="
          position:absolute;top:8px;left:8px;
          width:20px;height:20px;
          background:white;border-radius:50%;
          display:flex;align-items:center;justify-content:center;
          font-size:11px;
        ">상</div>
      </div>`,
      iconSize: [36, 44], iconAnchor: [18, 44], className: ''
    });
    L.marker(theirPos, { icon: theirIcon }).addTo(map).bindPopup('<b>상대방</b>');

    // 점선 연결
    L.polyline([myPos, theirPos], {
      color: '#007AFF', weight: 2, dashArray: '6, 6', opacity: 0.6
    }).addTo(map);

    // 재중심 버튼
    document.getElementById('recenter').onclick = () => {
      map.setView([(myPos[0]+theirPos[0])/2, (myPos[1]+theirPos[1])/2], 15);
    };

    // 거리 계산
    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2-lat1)*Math.PI/180;
      const dLng = (lng2-lng1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }

    const dist = haversine(...myPos, ...theirPos);
    document.getElementById('dist').textContent =
      dist < 1000 ? `${Math.round(dist)}m` : `${(dist/1000).toFixed(1)}km`;
    document.getElementById('walk').textContent  = Math.ceil(dist/67) + '분';
    document.getElementById('drive').textContent = Math.ceil(dist/500) + '분';
  </script>
</body>
</html>
